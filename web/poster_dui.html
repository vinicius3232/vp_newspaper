<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poster DUI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-color: transparent;
            overflow: hidden;
        }
        html, body {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0);
        }
        #poster-container {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.4);
        }
        #poster-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .fallback {
            font-family: 'Arial', sans-serif;
            font-size: 24px;
            font-weight: bold;
            color: #333333;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div id="poster-container">
        <img id="poster-img" src="" alt="Poster" style="display: none;" />
        <div id="fallback" class="fallback" style="display: none;">Weazel News</div>
    </div>

    <script>
        const img = document.getElementById('poster-img');
        const fallback = document.getElementById('fallback');

        function setImage(url) {
            if (!url || typeof url !== 'string') return;
            img.onload = () => {
                img.style.display = 'block';
                fallback.style.display = 'none';
            };
            img.onerror = () => {
                img.style.display = 'none';
                fallback.style.display = 'block';
            };
            img.src = url;
        }

        // 1. Suporte a Query Parameter (ex: ?url=https://...)
        const params = new URLSearchParams(window.location.search);
        const queryUrl = params.get('url');
        if (queryUrl) {
            setImage(decodeURIComponent(queryUrl));
        }

        // 2. Suporte a Mensagens NUI / DUI
        window.addEventListener('message', (event) => {
            if (event.data) {
                if (event.data.action === 'setImage' && event.data.url) {
                    setImage(event.data.url);
                } else if (event.data.action === 'setDUIVariables' && event.data.imageSrc) {
                    setImage(event.data.imageSrc);
                }
            }
        });
    </script>
</body>
</html>
